[project]
name = "okf-pg-tenant"
version = "0.1.0"
description = "Open Knowledge Format producer for multi-tenant, managed PostgreSQL"
authors = [{ name = "back1ply" }]
keywords = ["okf", "open-knowledge-format", "postgresql", "multi-tenant", "schema-drift", "metadata"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["psycopg[binary]>=3.1"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.6",
    "mypy>=1.8",
    "cosmic-ray>=8.4",
]

[project.urls]
Homepage = "https://github.com/back1ply/okf-pg-tenant"
Issues = "https://github.com/back1ply/okf-pg-tenant/issues"

[project.scripts]
okf-pg-tenant = "okf_pg_tenant:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561: without this marker a consumer's type checker skips the package
# entirely and every annotation in it is invisible.
[tool.setuptools.package-data]
okf_pg_tenant = ["py.typed"]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
# mypy dropped --python-version 3.9, so the syntax/typing floor is proven by
# ruff target-version below plus the 3.9 job in the test matrix, not here.
files = ["src"]
strict = true

[tool.pytest.ini_options]
testpaths = ["test_okf_pg_tenant.py"]
