[project]
name = "okf-pg-tenant"
version = "0.1.0"
description = "Open Knowledge Format producer for multi-tenant, managed PostgreSQL"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["psycopg[binary]>=3.1"]

[project.scripts]
okf-pg-tenant = "okf_pg_tenant:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["okf_pg_tenant"]
