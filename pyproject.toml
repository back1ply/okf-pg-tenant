[project]
name = "okf-pg-tenant"
version = "0.1.0"
description = "Open Knowledge Format producer for multi-tenant, managed PostgreSQL"
authors = [{ name = "back1ply" }]
keywords = ["okf", "open-knowledge-format", "postgresql", "multi-tenant", "schema-drift", "metadata"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["psycopg[binary]>=3.1"]

[project.urls]
Homepage = "https://github.com/back1ply/okf-pg-tenant"
Issues = "https://github.com/back1ply/okf-pg-tenant/issues"

[project.scripts]
okf-pg-tenant = "okf_pg_tenant:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["okf_pg_tenant"]
