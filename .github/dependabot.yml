version: 2

# The workflow pins every action to a commit SHA, which is what stops a moved tag
# from silently changing what CI runs. A pin with nothing proposing updates is a
# pin that rots, so this is the other half of that decision: Dependabot opens the
# PR, the SHA stays exact, and a human still approves the bump.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Runtime dependencies are deliberately just psycopg; this watches the dev
  # extras, where the linters and the mutation tool live.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
