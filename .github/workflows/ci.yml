name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --quiet -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      # mypy no longer accepts --python-version 3.9, so it runs unpinned and the
      # 3.9 floor is proven by ruff's target-version plus the 3.9 job below.
      - name: Types
        run: mypy

  test:
    # The version floor is a claim until something runs it. vermin puts the real
    # floor at 3.7; 3.9 is what the project supports, so 3.9 is what gets proven.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # src-layout means the package is not importable from the checkout root.
      # That is the point: the tests below run against an installed package, so
      # a file missing from the wheel fails here instead of after release.
      - name: Install
        run: python -m pip install --quiet -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Package installs and the console script exists
        run: |
          python -m pip install --quiet .
          okf-pg-tenant --help

  mutation:
    # Mutation testing is version-independent, so it runs once rather than three
    # times. Not decoration: a green suite says the tests ran, not that they check
    # anything. This says every mutant the tool could generate was caught, and the
    # survivors that remain are recorded with a reason in mutation-baseline.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --quiet -e ".[dev]"

      - name: Mutation gate
        run: python mutation_gate.py

  end-to-end:
    # The unit suite never touches a database by design, so nothing above proves
    # the tool works against real Postgres. This renders the demo seed and checks
    # the collapse arithmetic in the output.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: saas
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --quiet . pyyaml

      - name: Seed the demo database
        run: psql "postgresql://postgres:demo@localhost:5432/saas" -v ON_ERROR_STOP=1 -f demo/seed.sql

      - name: Produce a bundle
        run: okf-pg-tenant --dsn "postgresql://postgres:demo@localhost:5432/saas" --out ci-bundle

      - name: Check the bundle is what it claims
        run: |
          python - <<'PY'
          import pathlib, sys, yaml

          bundle = pathlib.Path("ci-bundle")
          expected = {
              "index.md",
              "_diagnostics.md",
              "tenant/invoice.md",
              "tenant/subscription.md",
          }
          missing = [p for p in expected if not (bundle / p).exists()]
          if missing:
              sys.exit(f"missing from the bundle: {missing}")

          doc = (bundle / "tenant/invoice.md").read_text(encoding="utf-8")
          front = yaml.safe_load(doc.split("---")[1])

          # The seed builds six tenant schemas: five hold invoice, one is empty,
          # and one of the five has a column dropped. Those numbers are the point
          # of the tool, so the run asserts them rather than eyeballing output.
          checks = {
              "tenancy.schemas": (front["tenancy"]["schemas"], 5),
              "tenancy.tenant_schemas_total": (front["tenancy"]["tenant_schemas_total"], 6),
              "tenancy.absent_from": (front["tenancy"]["absent_from"], 1),
              "tenancy.column_drift": (front["tenancy"]["column_drift"], 1),
              "tenancy.variants": (front["tenancy"]["variants"], 2),
              "tenancy.reference_ambiguous": (front["tenancy"]["reference_ambiguous"], False),
              "generated.by": (front["generated"]["by"], "process:okf-pg-tenant"),
              # COMMENT ON is read: the seed sets this one, so an empty
              # description here means comment extraction silently regressed.
              "description": (front["description"], "One row per issued invoice for this tenant."),
          }
          for name, (got, want) in checks.items():
              if got != want:
                  sys.exit(f"{name}: expected {want!r}, got {got!r}")

          resource = front["sources"][0]["resource"]
          if "demo" in resource or "@" in resource:
              sys.exit(f"credentials leaked into sources.resource: {resource!r}")

          # Claims the output must carry, not merely numbers that happen to match.
          if "**Not compared**" not in doc:
              sys.exit("the drift section no longer says what it does not compare")
          if "Gross total, tax included." not in doc:
              sys.exit("column comments are missing from the rendered table")

          index = (bundle / "index.md").read_text(encoding="utf-8")
          if "This inventory is incomplete" not in index:
              sys.exit("index.md does not warn that views are undocumented")

          print("bundle verified:", {k: v[0] for k, v in checks.items()})
          PY

      - name: The bundle must not be committed
        run: git status --porcelain --ignored=no | grep -q . && exit 1 || echo "working tree clean"
